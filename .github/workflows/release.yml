name: release

# 触发方式：推一个 v* 标签（如 v0.2.0）即构建并发布。
# 也可以在 Actions 页面手动 run，只做构建不发布（手动 run 不产出 release）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: build & release (windows/amd64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # main.go 用 //go:embed all:frontend/dist 内嵌前端产物，
      # 所以必须先构建前端，否则 go build / go vet / go test 全部报 embed 找不到目录。
      - name: 构建前端
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile --config.dangerouslyAllowAllBuilds=true
          pnpm run build

      - name: 编译
        run: go build ./...

      - name: 静态检查
        run: go vet ./...

      - name: 单元测试
        # 全部是纯单元测试，不依赖 Photoshop COM；需要真实 PS 的端到端验证走 cmd/probe 手动跑。
        run: go test ./... -count=1

      - name: 安装 Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: 构建 exe
        # -s 跳过 wails 自己的前端构建（上面已经构建过），避免重复装依赖。
        run: wails build -platform windows/amd64 -s -trimpath

      - name: 重命名为 ASCII 文件名并计算校验值
        shell: pwsh
        run: |
          $exe = Get-ChildItem build/bin/*.exe | Select-Object -First 1
          if (-not $exe) { throw "构建产物不存在：build/bin/*.exe" }
          # GitHub Release 会把中文资产名改写成 default.exe / exe.sha256，
          # 下载页看到的名字就没意义了。这里统一改成 ASCII 名再上传。
          $ascii = Join-Path $exe.DirectoryName 'titao-workbench.exe'
          if ($exe.FullName -ne $ascii) { Copy-Item $exe.FullName $ascii -Force }
          $hash = (Get-FileHash $ascii -Algorithm SHA256).Hash.ToLower()
          # 只写裸 64 位 hex：updater.VerifySHA256 取第一个空白分隔字段
          $hash | Out-File -FilePath "$ascii.sha256" -Encoding ascii -NoNewline
          Write-Output "SHA256=$hash"
          Write-Output "ASSET=$ascii"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: titao-workbench-windows-amd64
          path: |
            build/bin/titao-workbench.exe
            build/bin/titao-workbench.exe.sha256
          if-no-files-found: error
          retention-days: 14

      - name: 发布到 Release
        # 只有推 tag 时才发布；手动 run 只产出 artifact 供人工下载。
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/bin/titao-workbench.exe
            build/bin/titao-workbench.exe.sha256
          generate_release_notes: false
          draft: false
          # tag 带 '-' 视为预发布（如 v0.3.0-beta），updater 会主动跳过预发布
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            版本 ${{ github.ref_name }} 的 Windows x64 单文件版。

            下载 `titao-workbench.exe`（即「套图工作台」）直接双击运行，无需安装、不依赖 Python 或环境变量。
            首次运行会在 exe 同目录生成 `config.json`，需填入视觉模型接口的 API Key。

            校验方式（PowerShell）：
            ```powershell
            Get-FileHash .\titao-workbench.exe -Algorithm SHA256
            ```
            与同目录的 `.sha256` 文件内容比对。

            完整变更见 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
